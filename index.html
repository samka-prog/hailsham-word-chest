<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hailsham Word Chest — Vocabulary Trainer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">Hailsham · Vocabulary Chest</div>
    <h1>Never Let Me Go</h1>
    <p class="sub" id="chapter-sub">Loading…</p>
  </header>

  <nav class="modes" id="chapter-tabs" style="margin-bottom:0; padding-bottom:14px; border-bottom:none;"></nav>

  <nav class="modes">
    <button id="btn-flash" class="active">Flashcards</button>
    <button id="btn-cloze">Fill in the Gap</button>
  </nav>

  <div class="toolbar">
    <select id="category-filter">
      <option value="all">All categories</option>
      <option value="idiom">Idioms &amp; expressions</option>
      <option value="verb">Verbs &amp; phrasal verbs</option>
      <option value="adj">Adjectives &amp; adverbs</option>
    </select>
    <select id="sort-order">
      <option value="freq">Most useful first</option>
      <option value="shuffle">Shuffled</option>
      <option value="az">A → Z</option>
    </select>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <span id="progress-label">– / –</span>
  </div>

  <!-- FLASHCARD MODE -->
  <section id="flash-mode" class="stage">
    <div class="card-wrap">
      <div class="card" id="flash-card">
        <div class="face front" data-tag="Term" data-num=""></div>
        <div class="face back" data-tag="Meaning" data-num=""></div>
      </div>
    </div>
    <div class="controls" id="flash-controls">
      <button class="icon-btn" id="prev-btn" title="Previous">‹</button>
      <button class="judge-btn no" id="dontknow-btn">Don't know it</button>
      <button class="judge-btn yes" id="knowit-btn">Know it</button>
      <button class="icon-btn" id="next-btn" title="Next">›</button>
    </div>
    <div class="stat-row">
      <span>Known: <b id="known-count">0</b></span>
      <span>Still learning: <b id="unknown-count">0</b></span>
      <span>Shuffle: <span class="icon-btn" id="shuffle-btn" style="width:auto;height:auto;border:none;background:none;padding:0;display:inline;cursor:pointer;color:var(--brass);">↻</span></span>
    </div>
  </section>

  <!-- CLOZE MODE -->
  <section id="cloze-mode" class="stage" style="display:none;">
    <div class="cloze-card" id="cloze-card" data-num="">
      <div class="cloze-cat" id="cloze-cat"></div>
      <div class="cloze-def" id="cloze-def"></div>
      <div class="cloze-sentence" id="cloze-sentence"></div>
      <div class="feedback" id="cloze-feedback"></div>
      <div class="cloze-actions">
        <button class="primary-btn" id="check-btn">Check</button>
        <button class="ghost-btn" id="reveal-btn">Reveal</button>
        <button class="ghost-btn" id="cloze-next-btn">Next →</button>
      </div>
    </div>
    <div class="stat-row">
      <span>Correct: <b id="cloze-correct">0</b></span>
      <span>Attempted: <b id="cloze-attempted">0</b></span>
    </div>
  </section>

</div>

<script src="js/app.js"></script>
</body>
</html>
